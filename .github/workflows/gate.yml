# prof-DA evidence gate (Layer 3) - blocks a PR until deliverables are proven + requirements reconciled.
name: prof-DA evidence gate
on:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: prof-DA evidence gate
        run: |
          GATE="${PROFDA_GATE:-adapters/gate.py}"
          RECEIPT=".prof-da/pending-validation.json"
          if [ -f "$GATE" ]; then python "$GATE" "$RECEIPT"; fi
