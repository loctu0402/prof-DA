# prof-DA evidence gate (Layer 3) - a drop-in CI step (GitHub Actions / GitLab). Nonzero exit = red
# build = the deliverable is not proven. Set PROFDA_GATE to the plugin's adapters/gate.py if out-of-tree.
- name: prof-DA evidence gate
  run: |
    GATE="${PROFDA_GATE:-adapters/gate.py}"
    RECEIPT=".prof-da/pending-validation.json"
    if [ -f "$GATE" ]; then python "$GATE" "$RECEIPT"; fi
